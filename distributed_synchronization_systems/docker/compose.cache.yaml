version: "3.9"
services:
  cache_node_0:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cache
    env_file: ../.env
    environment:
      - PORT=8000
      - PEERS=http://cache_node_1:8001,http://cache_node_2:8002
    ports:
      - "7000:8000"

  cache_node_1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cache
    env_file: ../.env
    environment:
      - PORT=8001
      - PEERS=http://cache_node_0:8000,http://cache_node_2:8002
    ports:
      - "7001:8001"

  cache_node_2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cache
    env_file: ../.env
    environment:
      - PORT=8002
      - PEERS=http://cache_node_0:8000,http://cache_node_1:8001
    ports:
      - "7002:8002"
